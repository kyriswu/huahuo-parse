name: huahuo-parse
services:
  api:
    image: ${DOCKERHUB_REPO:-magiclaw/huahuo-parse}:${VERSION_TAG:-local}
    platform: linux/amd64
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      PORT: "4763"
      PADDLEOCR_BACKEND: cuda
      MODEL_ROOT: /opt/models
      STORAGE_LOCAL_ROOT: /app/var/storage
    gpus: all
    shm_size: 2gb
    cpus: 4
    mem_limit: 14g
    ports:
      - "${PORT:-4763}:4763"
    volumes:
      - storage:/app/var/storage
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  storage:
