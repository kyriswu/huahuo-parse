name: huahuo-parse

services:
  api:
    image: huahuo-parse:0.1.0
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    init: true
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      PORT: "4763"
      STORAGE_LOCAL_ROOT: /app/var/storage
    ports:
      - "${PORT:-4763}:4763"
    volumes:
      - storage:/app/var/storage
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage:
